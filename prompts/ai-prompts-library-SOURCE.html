<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>AI Prompts Library — aiopentec</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
@page{size:8.5in 11in;margin:0}
html,body{background:#e2e8f0}
body{font-family:Inter,'Segoe UI',Arial,sans-serif;color:#0f172a;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.page{width:816px;min-height:1056px;margin:0 auto;background:#fff;position:relative;overflow:hidden;page-break-after:always}
.pg{padding:44px 58px 74px;--c:#3b82f6;--cd:#1d4ed8;--cl:#dbeafe;--cx:#eff6ff}
.s-cc{--c:#3b82f6;--cd:#1d4ed8;--cl:#dbeafe;--cx:#eff6ff}
.s-bs{--c:#6366f1;--cd:#4f46e5;--cl:#e0e7ff;--cx:#eef2ff}
.s-pt{--c:#f59e0b;--cd:#b45309;--cl:#fef3c7;--cx:#fffbeb}
.s-rd{--c:#10b981;--cd:#047857;--cl:#d1fae5;--cx:#ecfdf5}
.s-un{--c:#8b5cf6;--cd:#6d28d9;--cl:#ede9fe;--cx:#f5f3ff}
.pg::before{content:"";position:absolute;top:0;left:0;right:0;height:6px;background:linear-gradient(90deg,var(--c),var(--cd))}
.rh{display:flex;justify-content:space-between;align-items:center;padding-bottom:8px;border-bottom:1px solid #e2e8f0;margin-bottom:14px}
.rh .b{font-size:8px;font-weight:800;letter-spacing:.16em;color:#94a3b8}
.rh .cat{font-size:8px;font-weight:800;letter-spacing:.14em;color:var(--cd);display:flex;align-items:center;gap:6px}
.rh .cat i{width:6px;height:6px;border-radius:2px;background:var(--c)}
.pf{position:absolute;bottom:26px;left:58px;right:58px;display:flex;justify-content:space-between;align-items:center}
.fbrand{display:flex;align-items:center;gap:7px;font:700 8px 'JetBrains Mono',monospace;letter-spacing:.1em;color:#94a3b8}
.fbrand svg{display:block}
.no{color:#fff;background:var(--c);padding:2px 9px;border-radius:20px;font:700 8px 'JetBrains Mono',monospace;letter-spacing:.08em}
.ico{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.p{border:1px solid #e2e8f0;border-left:3px solid var(--c);border-radius:10px;padding:12px 14px 10px;margin-bottom:12px;background:#fff;page-break-inside:avoid;break-inside:avoid;box-shadow:0 1px 2px rgba(15,23,42,.05)}
.h{display:flex;align-items:center;gap:9px;margin-bottom:7px}
.n{min-width:24px;height:24px;border-radius:7px;background:var(--c);color:#fff;font:800 10.5px Inter;display:flex;align-items:center;justify-content:center}
.t{font-size:13px;font-weight:800;color:#0f172a;flex:1;line-height:1.25}
.t span{color:var(--cd);font-weight:700}
.h .ic{width:21px;height:21px;color:var(--c);flex:0 0 auto}
.ld{font-size:11px;font-weight:600;color:#1e293b;margin-bottom:6px;line-height:1.5}
ul.bl{list-style:none;margin:0 0 5px;padding:0}
ul.bl li{position:relative;padding-left:12px;font-size:10.6px;line-height:1.5;margin:2.5px 0;color:#334155}
ul.bl li::before{content:"";position:absolute;left:1px;top:7px;width:4px;height:4px;border-radius:1px;background:var(--c)}
ol.nl{list-style:none;counter-reset:it;margin:0 0 5px;padding:0}
ol.nl li{position:relative;padding-left:18px;font-size:10.6px;line-height:1.5;margin:2.5px 0;counter-increment:it;color:#334155}
ol.nl li::before{content:counter(it);position:absolute;left:0;top:3px;font:700 8.5px 'JetBrains Mono',monospace;color:var(--cd)}
ol.nl ul.bl{margin:2px 0 3px}
ol.nl ul.bl li{font-size:10.2px}
.lb{font-weight:800;color:#0f172a}
.hd{font-size:10px;font-weight:800;letter-spacing:.04em;color:var(--cd);margin:7px 0 3px}
.v{font-family:'JetBrains Mono',monospace;font-size:9.5px;font-weight:700;color:var(--cd);background:var(--cx);border:1px solid var(--cl);padding:0 3px;border-radius:3px;white-space:nowrap}
.cols2{column-count:2;column-gap:20px}
.cols2 li{break-inside:avoid}
.fmt{font-size:10.3px;color:#64748b;font-style:italic;margin-top:4px}
.tip{background:var(--cx);border:1px solid var(--cl);border-left:3px solid var(--c);border-radius:8px;padding:9px 12px;font-size:10.4px;color:#334155;margin:4px 0 12px;line-height:1.5}
.tip b{color:var(--cd)}
/* covers + dividers */
.cover,.back,.div{min-height:1056px;overflow:hidden;--c:#3b82f6;--cd:#1d4ed8;--cl:#dbeafe;--cx:#eff6ff}
.cbg{position:absolute;inset:0;background:linear-gradient(160deg,#f8fafc,#eff6ff 55%,#dbeafe)}
.dv{position:absolute;inset:0;background:linear-gradient(155deg,#fff,var(--cx) 45%,var(--cl))}
.dots{position:absolute;inset:0;background-image:radial-gradient(#3b82f6 1px,transparent 1px);background-size:22px 22px;opacity:.12}
.glo{position:absolute;width:620px;height:620px;border-radius:50%;background:radial-gradient(circle,rgba(59,130,246,.16),rgba(59,130,246,0) 65%)}
.glo2{position:absolute;width:520px;height:520px;border-radius:50%;background:radial-gradient(circle,rgba(139,92,246,.12),rgba(139,92,246,0) 65%)}
.cin{position:relative;height:1056px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 70px;text-align:center}
.badge{display:inline-block;background:#dbeafe;color:#1e40af;border:1px solid #bfdbfe;border-radius:30px;padding:6px 18px;font:800 10px 'JetBrains Mono',monospace;letter-spacing:.22em}
.wm{font:800 40px/1 Inter;letter-spacing:-.02em;color:#0f172a}
.tg{font:600 10px 'JetBrains Mono',monospace;letter-spacing:.34em;color:#64748b;margin-top:7px;text-transform:lowercase}
.cv-t{font:800 46px/1.05 Inter;letter-spacing:-.01em;color:#0f172a}
.cv-bar{width:96px;height:5px;border-radius:3px;background:linear-gradient(90deg,#3b82f6,#8b5cf6);margin:16px 0 20px}
.cv-feats{list-style:none;margin-bottom:26px}
.cv-feats li{display:flex;align-items:center;justify-content:center;gap:8px;font-size:12.5px;font-weight:600;color:#334155;margin:7px 0}
.cv-feats .ico{width:15px;height:15px;color:#3b82f6}
.cv-stats{display:flex;align-items:center;gap:14px;font:700 9.5px 'JetBrains Mono',monospace;letter-spacing:.14em;color:#64748b;border-top:1px solid #cbd5e1;padding-top:18px;flex-wrap:wrap;justify-content:center}
.cv-stats i{width:4px;height:4px;border-radius:1px;background:#3b82f6}
.urltag{font:700 11px 'JetBrains Mono',monospace;letter-spacing:.18em;color:#1d4ed8}
/* divider */
.din{position:relative;height:1056px;padding:70px 64px;display:flex;flex-direction:column}
.dsec{font:800 9.5px 'JetBrains Mono',monospace;letter-spacing:.34em;color:var(--cd)}
.dtitle{font:800 41px/1.08 Inter;letter-spacing:-.02em;color:#0f172a;margin:10px 0 12px}
.ddesc{font-size:12px;color:#475569;max-width:560px;line-height:1.65}
.dbadge{display:inline-flex;align-self:flex-start;background:#fff;border:1px solid var(--c);color:var(--cd);border-radius:30px;padding:7px 16px;font:800 9.5px 'JetBrains Mono',monospace;letter-spacing:.14em;margin:18px 0 24px}
.dlist{column-count:2;column-gap:30px;max-width:660px}
.dli{display:flex;gap:9px;font-size:10.6px;font-weight:600;color:#334155;padding:5px 0;border-bottom:1px solid #cbd5e1;break-inside:avoid}
.dli b{font:700 9.5px 'JetBrains Mono',monospace;color:var(--cd);min-width:22px}
/* how-to */
.h1{font:800 23px/1.15 Inter;color:#0f172a}
.kick{font:800 8.5px 'JetBrains Mono',monospace;letter-spacing:.22em;color:#1d4ed8;margin-bottom:6px}
.intro{font-size:11.5px;color:#334155;line-height:1.65;margin:10px 0 14px;max-width:680px}
.steps{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:6px 0 14px}
.step{display:flex;gap:10px;background:#f8fafc;border:1px solid #e2e8f0;border-radius:9px;padding:9px 11px}
.sn{width:18px;height:18px;border-radius:50%;background:#3b82f6;color:#fff;font:800 9px Inter;display:flex;align-items:center;justify-content:center;flex:0 0 auto;margin-top:1px}
.step p{font-size:10.4px;color:#334155;line-height:1.5}
.flow{display:flex;align-items:center;justify-content:center;gap:10px;margin:6px 0 14px}
.fseg{font:800 11px 'JetBrains Mono',monospace;color:#1d4ed8;border:1.5px solid #93c5fd;background:#eff6ff;border-radius:9px;padding:8px 14px}
.far{color:#93c5fd;font-weight:800}
.toc{border:1px solid #e2e8f0;border-radius:11px;overflow:hidden;margin-top:12px}
.toc .row{display:flex;align-items:center;gap:11px;padding:8px 13px;border-bottom:1px solid #eef2f7;background:#fff}
.toc .row:last-child{border-bottom:none}
.toc .sq{width:27px;height:27px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.toc .sq .ico{width:15px;height:15px}
.toc .nm{font-size:11.5px;font-weight:700;color:#0f172a;flex:1}
.toc .rg{font:600 9.5px 'JetBrains Mono',monospace;color:#64748b}
.toc .ct{font:700 9px Inter;background:#eff6ff;color:#1d4ed8;border-radius:20px;padding:2px 9px}
/* bonus */
.bgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:14px 0}
.bt{border:1px solid #dbeafe;background:#fff;border-radius:10px;padding:10px 12px;display:flex;gap:10px}
.bt .sq{width:24px;height:24px;border-radius:7px;background:linear-gradient(135deg,#3b82f6,#1d4ed8);color:#fff;font:800 11px 'JetBrains Mono',monospace;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.bt b{font-size:10.8px;color:#1e3a8a;display:block;margin-bottom:2px}
.bt p{font-size:10px;color:#475569;line-height:1.5}
.fin{background:linear-gradient(140deg,#eff6ff,#dbeafe);border:1px solid #bfdbfe;border-radius:14px;padding:22px 26px;text-align:center}
.fin .big{font:800 19px Inter;color:#0f172a;margin-bottom:8px}
.fin p{font-size:11px;color:#334155;line-height:1.65;max-width:560px;margin:0 auto 4px}
.fin .gl{font:700 10.5px 'JetBrains Mono',monospace;color:#1d4ed8;margin-top:8px}
/* back cover */
.wic{width:100%;max-width:470px;background:#fff;border:1px solid #dbeafe;border-radius:14px;padding:16px 20px;margin-bottom:26px;box-shadow:0 8px 20px rgba(59,130,246,.08);text-align:left}
.wic .lbl{font:800 8.5px 'JetBrains Mono',monospace;letter-spacing:.24em;color:#94a3b8;margin-bottom:10px;text-align:center}
.wic .row{display:flex;align-items:center;gap:12px;padding:6.5px 0;border-bottom:1px solid #f1f5f9}
.wic .row:last-child{border-bottom:none}
.wic .sq{width:26px;height:26px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.wic .sq .ico{width:14px;height:14px}
.wic .nm{font-size:11.5px;font-weight:700;color:#0f172a;flex:1}
.wic .rg{font:600 9px 'JetBrains Mono',monospace;color:#64748b;letter-spacing:.06em}
.bk-big{font:800 24px Inter;background:linear-gradient(90deg,#1d4ed8,#6366f1,#8b5cf6);-webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:10px}
.bk-sub{font-size:11px;color:#64748b;line-height:1.6;max-width:380px}
@media screen{.page{margin:20px auto;box-shadow:0 10px 34px rgba(15,23,42,.18)}}
@media print{body{background:#fff}.page{margin:0;box-shadow:none}.page:last-child{page-break-after:auto}}
</style>
</head>

<script>
/* ============ brand mark · right-aligned staircase ============ */
const GC=[[2,0],[1,1],[2,1],[0,2],[1,2],[2,2]];
function mark(s,col,ghost){col=col||'#3b82f6';let o=`<svg width="${s}" height="${s}" viewBox="0 0 66 66" xmlns="http://www.w3.org/2000/svg">`;
for(let c=0;c<3;c++)for(let r=0;r<3;r++){const x=c*24,y=r*24,on=GC.some(p=>p[0]===c&&p[1]===r);
o+=on?`<rect x="${x}" y="${y}" width="18" height="18" rx="4" fill="${col}"/>`:(ghost?'':`<rect x="${x}" y="${y}" width="18" height="18" rx="4" fill="#e8edf3"/>`)}
return o+'</svg>'}
const FM=mark(11);

/* ============ render helpers ============ */
const hl=s=>String(s).replace(/\[([^\]]+)\]/g,'<b class="v">[$1]</b>');
function bull(a){return '<ul class="bl">'+a.map(it=>{const s=String(it);
 if(s[0]==='!'){const i=s.indexOf(':');return `<li><span class="lb">${s.slice(1,i)}:</span> ${hl(s.slice(i+1))}</li>`}
 return '<li>'+hl(s)+'</li>'}).join('')+'</ul>'}
function kv(a){return '<ul class="bl">'+a.map(r=>`<li><span class="lb">${r[0]}:</span> ${hl(r[1])}</li>`).join('')+'</ul>'}
function ord(a){return '<ol class="nl">'+a.map(it=>{
 if(typeof it==='string')return '<li>'+hl(it)+'</li>';
 let sub='';if(it.sub){const col=it.sub.col;const items=Array.isArray(it.sub)?it.sub:it.sub.a;
  sub=`<ul class="bl${col?' cols2':''}">${items.map(s=>'<li>'+hl(s)+'</li>').join('')}</ul>`}
 return `<li>${hl(it.x)}${sub}</li>`}).join('')+'</ol>'}
function blocks(arr){return arr.map(bl=>{switch(bl[0]){
 case 'L':return '<p class="ld">'+hl(bl[1])+'</p>';
 case 'P':return '<p class="ld" style="font-weight:400">'+hl(bl[1])+'</p>';
 case 'K':return kv(bl[1]);
 case 'B':return bull(bl[1]);
 case 'B2':return '<div class="cols2" style="margin-bottom:5px">'+bull(bl[1])+'</div>';
 case 'H':return `<div class="hd">${bl[1]}</div>`;
 case 'O':return ord(bl[1]);
 case 'O2':return '<div class="cols2" style="margin-bottom:5px">'+ord(bl[1]).replace('<ol class="nl">','<ol class="nl cols2">')+'</div>';
 case 'F':return `<p class="fmt">${bl[1]}</p>`}}).join('')}
function card(p){return `<div class="p"><div class="h"><div class="n">${p.n}</div><div class="t">${p.t} <span>${p.s}</span></div><svg class="ic ico"><use href="#i-${p.ic}"/></svg></div>${blocks(p.b)}</div>`}
